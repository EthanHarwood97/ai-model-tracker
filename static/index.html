<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0e0d">
  <meta name="description" content="A live observatory for AI model performance, cost, and confidence.">
  <title>Model Signal / AI leaderboard observatory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Primary navigation">
      <div class="rail-top">
        <a class="wordmark" href="." aria-label="Model Signal home">
          <span class="wordmark-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><b>MODEL</b><em>SIGNAL</em></span>
        </a>
        <div class="rail-caption">Personal intelligence desk<br>tracking the frontier</div>
      </div>

      <div class="rail-section-label">Workspace</div>
      <nav class="nav-stack" id="nav" aria-label="Views">
        <button class="nav-item active" data-view="overview" aria-current="page">
          <span class="nav-num">01</span><span class="nav-name">Overview</span><span class="nav-mark"></span>
        </button>
        <button class="nav-item" data-view="meta">
          <span class="nav-num">02</span><span class="nav-name">Meta ranking</span><span class="nav-mark"></span>
        </button>
        <button class="nav-item" data-view="coding">
          <span class="nav-num">03</span><span class="nav-name">Coding agents</span><span class="nav-mark"></span>
        </button>
        <button class="nav-item" data-view="est">
          <span class="nav-num">04</span><span class="nav-name">Estimates</span><span class="nav-mark"></span>
        </button>
        <button class="nav-item" data-view="value">
          <span class="nav-num">05</span><span class="nav-name">Value watch</span><span class="nav-mark"></span>
        </button>
        <button class="nav-item" data-view="changes">
          <span class="nav-num">06</span><span class="nav-name">Change log</span><span class="nav-mark"></span>
        </button>
        <button class="nav-item" data-view="sources">
          <span class="nav-num">07</span><span class="nav-name">Sources</span><span class="nav-mark"></span>
        </button>
      </nav>

      <div class="rail-bottom">
        <div class="sync-card" id="sync-card">
          <span class="status-orb" aria-hidden="true"></span>
          <div><b id="sync-label">Awaiting scan</b><small id="source-summary">Loading source health</small></div>
        </div>
        <button id="refresh-btn" class="refresh-button" title="Run a fresh scan">
          <span>Refresh scan</span><kbd>R</kbd>
        </button>
      </div>
    </aside>

    <div class="page-shell">
      <header class="topbar">
        <div class="mobile-wordmark"><span class="wordmark-mark" aria-hidden="true"><i></i><i></i><i></i></span><b>MODEL SIGNAL</b></div>
        <div class="location"><span class="location-pip"></span><span id="section-kicker">Signal desk / overview</span></div>
        <div class="topbar-meta"><span id="last-update">Connecting to index</span><span class="topbar-divider"></span><span>UTC</span></div>
      </header>

      <main id="app-main" tabindex="-1"></main>

      <footer class="footer-bar">
        <span>MODEL SIGNAL <b>///</b> PERSONAL INDEX</span>
        <span>13 live sources <b>·</b> SQLite snapshots <b>·</b> EST error ±0.06</span>
      </footer>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="detail-drawer" id="detail-drawer" aria-labelledby="drawer-title" aria-hidden="true" tabindex="-1">
    <button class="drawer-close" id="drawer-close" aria-label="Close model details">×</button>
    <div id="drawer-content"></div>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
